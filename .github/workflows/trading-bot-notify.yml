# Trading-Bot (Lernprojekt): tägliche Signal-E-Mail – ohne eigenen Computer.
#
# Läuft Montag–Freitag um 20:45 UTC (= 22:45 Uhr Sommerzeit / 21:45 Uhr Winterzeit).
# Manuell starten: GitHub → Actions → "Trading-Bot Signal-E-Mail" → "Run workflow".
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   GIST_TOKEN         GitHub-Token mit "Gists: Read and write" (dieselbe wie in der App)
#   SMTP_SENDER        Gmail-Adresse, von der gesendet wird
#   SMTP_APP_PASSWORD  Gmail-App-Passwort
#   SMTP_RECIPIENT     Empfänger-Adresse
#
# Hinweis: Zeitgesteuerte Workflows laufen nur auf dem Standard-Branch (main).
name: Trading-Bot Signal-E-Mail

on:
  schedule:
    - cron: "45 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trading_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading_bot/requirements.txt
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Signale berechnen und E-Mail senden
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
        run: python notify.py
